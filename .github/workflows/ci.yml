name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  # Technical debt register Item 1: the regular `test` job above runs
  # entirely against in-memory SQLite and cannot exercise Postgres-only DDL
  # (e.g. ALTER COLUMN ... TYPE, used by an existing migration). This job
  # proves the actual Alembic chain applies cleanly to a real, ephemeral
  # Postgres server -- a fresh service container, never the production
  # database, no secrets required.
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ican_ci
          POSTGRES_PASSWORD: ican_ci
          POSTGRES_DB: ican_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ican_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify Alembic migrations against real PostgreSQL
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://ican_ci:ican_ci@localhost:5432/ican_ci
        run: pytest tests/test_migrations_postgres.py -v
