[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Regression baseline requirement (Issue #12): the test suite must never make
# a real network call to Anthropic or Telegram. Loopback is allowed because
# asyncio's ProactorEventLoop (Windows) and aiosqlite emulate socketpairs over
# 127.0.0.1 internally — only non-loopback (real external API) traffic is blocked.
addopts = --disable-socket --allow-hosts=127.0.0.1,::1
